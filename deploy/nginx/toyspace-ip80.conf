# 微信公众号回调只能用 80/443 端口，支付宝异步通知在标准端口上也更可靠。
# 只对“直接用 IP 访问”开放这两条路径，其余请求仍按 00-default-deny 的做法直接断开连接。
server {
    listen 80;
    listen [::]:80;
    server_name 40.160.139.154;

    location = /api/v1/weixin/portal/receive {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 32k;
    }

    location = /api/v1/alipay/alipay_notify_url {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 32k;
    }

    # 保留 certbot 验证路径，与默认站点一致
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 444;
    }
}
