# 玩集 TOYSPACE：https://shop.openrelayx.cc（经 Cloudflare 代理，SSL 模式 Full）
server {
    listen 80;
    listen [::]:80;
    server_name shop.openrelayx.cc;

    # Let's Encrypt 签发与续期校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.openrelayx.cc;

    ssl_certificate     /etc/letsencrypt/live/shop.openrelayx.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.openrelayx.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 还原访客真实 IP（Cloudflare 回源时客户端地址在 CF-Connecting-IP 里）
    include snippets/cloudflare-realip.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include snippets/toyspace-site.conf;
}
