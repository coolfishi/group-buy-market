# 玩集 TOYSPACE 站点公共配置，被 8898 端口和 shop.openrelayx.cc 两个 server 引用
#   /          商城前端（真实模式）  /var/www/toyspace
#   /demo/     演示站（本地模拟数据）/var/www/toyspace-demo
#   /admin/    管理台               /var/www/toyspace-admin
# 安装位置：/etc/nginx/snippets/toyspace-site.conf
root /var/www/toyspace;
index index.html;

gzip on;
gzip_types text/css application/javascript image/svg+xml application/json;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# 用 Nginx 确认过的客户端地址覆盖，不接受访客自带的 X-Forwarded-For（管理台按 IP 限制登录失败次数）
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 20s;
client_max_body_size 64k;

# 拼团服务：只公开商品页查询接口；dcc、trade、test、actuator 仅限本机访问
location /api/v1/gbm/index/ {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:18091;
}

# 商城服务：登录、下单、订单、退单、支付宝异步通知
location /api/v1/login/ {
    proxy_pass http://127.0.0.1:13100;
}
location /api/v1/alipay/ {
    proxy_pass http://127.0.0.1:13100;
}
# 拼团成团回调只走内部网络，外部一律拒绝
location = /api/v1/alipay/group_buy_notify {
    return 404;
}
location = /api/v1/alipay/mock_paid {
    return 404;
}

# 商城公开只读接口：首页“正在拼团”
location /api/v1/mall/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:13100;
}

# 管理台接口
location /api/admin/ {
    proxy_pass http://127.0.0.1:13100;
}

# 微信公众号服务器回调（签名校验在商城服务里）
location = /api/v1/weixin/portal/receive {
    proxy_pass http://127.0.0.1:13100;
}

location /api/ {
    return 404;
}

location /admin/ {
    alias /var/www/toyspace-admin/;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /admin/index.html;
}

location /demo/ {
    alias /var/www/toyspace-demo/;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /demo/index.html;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location /art/ {
    expires 7d;
    try_files $uri =404;
}

# SPA 路由回退
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
