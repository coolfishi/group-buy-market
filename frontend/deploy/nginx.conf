# 玩集 TOYSPACE 前端 Nginx 配置示例
# 1. npm run build（演示）或 npm run build:live（真实），把 dist/ 拷贝到 root 指向的目录
# 2. 把 upstream 改成你自己的服务地址；不要照抄示例中的地址
# 3. 真实模式下 VITE_GBM_API_BASE / VITE_MALL_API_BASE 填 "/"，即走下面的同源代理

upstream toyspace_group_buy_market {
    # 拼团营销服务（group-buy-market-app），可配置多个节点
    server 127.0.0.1:8091;
}

upstream toyspace_pay_mall {
    # 外部支付商城（提供微信登录、下单、订单列表、退单接口）
    server 127.0.0.1:9091;
}

server {
    listen 80;
    server_name toyspace.example.com;  # 改为你的域名

    root /usr/share/nginx/toyspace;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # API 代理
    location /api/v1/gbm/ {
        proxy_pass http://toyspace_group_buy_market;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location ~ ^/api/v1/(alipay|login)/ {
        proxy_pass http://toyspace_pay_mall;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # 带哈希的构建产物长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /art/ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA 路由回退：/products/xxx、/orders 等刷新后仍返回 index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
